<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Responsive layout for desktop and mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Application identity -->
  <title>PropertyOS | Property Management</title>

  <meta name="description"
    content="PropertyOS — manage properties, rooms, tenants, rent, payments, electricity meters, and financial records." />

  <meta name="application-name" content="PropertyOS" />
  <meta name="theme-color" content="#0f172a" />

  <!-- T&N House's logo: browser tab -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- PNG fallback for browser compatibility -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

  <!-- Apple iPhone and iPad home-screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Android and installable Progressive Web App -->
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Apple mobile web app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="PropertyOS" />

  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Windows and browser color scheme -->
  <meta name="color-scheme" content="light" />
</head>

<body>
  <div id="root"></div>

  <!-- PropertyOS React application -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
